name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Svelte + TypeScript check
        uses: docker/build-push-action@v7
        with:
          context: .
          target: check
          push: false
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

      - name: Biome lint
        uses: docker/build-push-action@v7
        with:
          context: .
          target: lint
          push: false
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

      - name: Vitest with coverage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

  rust:
    name: rust fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # The real-PDF oracle tests are gated on a local PII file that is absent
        # in CI, so they no-op here; everything else runs.
        run: cargo test --workspace
