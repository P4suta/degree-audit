name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The wasm glue is no longer vendored — regenerate it so the Docker build
      # context (which includes src/lib/wasm) carries a fresh, in-sync build.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Set up tools (mise)
        uses: jdx/mise-action@v2
      - name: Build WASM glue
        run: just wasm-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Svelte + TypeScript check
        uses: docker/build-push-action@v7
        with:
          context: .
          target: check
          push: false
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

      - name: Biome lint
        uses: docker/build-push-action@v7
        with:
          context: .
          target: lint
          push: false
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

      - name: Vitest with coverage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

  rust:
    name: rust fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rust-toolchain.toml drives the version + components (rustfmt/clippy);
      # the action caches ~/.cargo and target.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # The real-PDF oracle tests are gated on a local PII file that is absent
        # in CI, so they no-op here; everything else runs.
        run: cargo test --workspace

  wasm:
    name: WASM boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Set up tools (mise)
        uses: jdx/mise-action@v2

      # Exercises the #[wasm_bindgen] surface under node — the JsValue shapes
      # (camelCase keys, error propagation) the front-end relies on.
      - name: wasm boundary tests (node)
        run: wasm-pack test --node crates/audit-wasm

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up tools (mise)
        uses: jdx/mise-action@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      # CJK fonts so the Japanese UI renders (axe/layout assertions depend on it).
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run E2E (consent dialog / dark theme / axe a11y)
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
