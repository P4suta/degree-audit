name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The wasm glue is no longer vendored — regenerate it so the Docker build
      # context (which includes src/lib/wasm) carries a fresh, in-sync build.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Set up tools (mise)
        uses: jdx/mise-action@v2
      - name: Build WASM glue
        run: just wasm-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site via Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build-output
          build-args: |
            BASE_PATH=${{ steps.pages.outputs.base_path }}
          outputs: type=local,dest=./build
          cache-from: type=gha,scope=degree-audit
          cache-to: type=gha,mode=max,scope=degree-audit

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
