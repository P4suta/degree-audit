# degree-audit CLI — run an audit in the terminal (composition root).
[package]
name = "degree-audit-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "degree-audit"
path = "src/main.rs"

[dependencies]
audit-domain.workspace = true
audit-app.workspace = true
transcript-parse.workspace = true
clap = { version = "4", features = ["derive", "wrap_help"] }
serde_json.workspace = true

# Presentation stack (native CLI only — the core stays free of these).
anstyle.workspace = true
anstream.workspace = true
indicatif.workspace = true
miette.workspace = true
inquire.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
terminal_size.workspace = true
unicode-width.workspace = true
