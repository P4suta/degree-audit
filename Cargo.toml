# Rust/WASM shared core. The same domain is shared across both the native (CLI)
# and wasm32 targets. See the plan file under .claude/plans and each crate's docs
# for the detailed design.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal cross-crate dependencies (inward-pointing, one-directional DAG).
audit-text = { path = "crates/audit-text" }
audit-domain = { path = "crates/audit-domain" }
audit-app = { path = "crates/audit-app" }
pdf-glyphs = { path = "crates/pdf-glyphs" }
transcript-parse = { path = "crates/transcript-parse" }

# External dependencies: versions are pinned centrally here.
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# CLI-only presentation stack (used solely by crates/cli; keeps the core pure).
anstyle = "1"
anstream = "0.6"
indicatif = "0.17"
miette = { version = "7", features = ["fancy"] }
inquire = "0.7"
clap_complete = "4"
clap_mangen = "0.2"
terminal_size = "0.4"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
