# audit-wasm — the browser driving adapter. Exposes the shared core to JS.
# The boundary is JSON DTOs only; the domain types serialize straight through, so
# a future SvelteKit front-end consumes the same `Assessment` shape as the CLI.
[package]
name = "audit-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
audit-domain.workspace = true
audit-app.workspace = true
transcript-parse.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
