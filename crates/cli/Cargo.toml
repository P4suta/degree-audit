# degree-audit CLI — run an audit in the terminal (composition root).
[package]
name = "degree-audit-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "degree-audit"
path = "src/main.rs"

[dependencies]
audit-domain.workspace = true
audit-app.workspace = true
transcript-parse.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
