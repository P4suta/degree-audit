# pdf-glyphs — positioned text-fragment extraction from "Microsoft Print To PDF"
# transcripts. Pure Rust, wasm32-compatible: it parses the PDF container with
# `lopdf`, interprets the text-showing
# operators of each page's content stream, and maps CID codes to Unicode via the
# font's /ToUnicode CMap. Column/row clustering lives in a later crate.
[package]
name = "pdf-glyphs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Disable optional clock and parallelism features.
# Select browser randomness for the WebAssembly build.
lopdf = { version = "0.46", default-features = false, features = ["wasm_js"] }
