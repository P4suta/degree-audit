version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # svelte-check does not yet support TypeScript 7; hold the major bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      js:
        patterns: ["*"]
