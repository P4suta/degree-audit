name: Mutants

# Mutation testing: do the tests actually kill injected bugs? Full run weekly;
# a fast changed-lines run on PRs (advisory — it never blocks the merge).
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for the PR --in-diff base

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # PR: only the changed lines, and advisory (a surviving mutant is a nudge,
      # not a gate). Scope lives in mutants.toml.
      - name: mutants (PR diff)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          cargo mutants --no-shuffle --in-diff pr.diff

      - name: mutants (full)
        if: github.event_name != 'pull_request'
        run: cargo mutants --no-shuffle

      - name: Upload mutants report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
